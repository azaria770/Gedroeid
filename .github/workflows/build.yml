
name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # מאפשר להריץ את הבנייה גם ידנית בלחיצת כפתור

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest # שרת לינוקס נקי בענן של גיטהאב

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-app
          path: build/apk/*.apk
